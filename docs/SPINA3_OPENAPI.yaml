        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/silence/:
    get:
      operationId: silence_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Stan ciszy wyborczej (co jest wstrzymane)
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilenceOut'
          description: ''
  /api/spina3/wall/:
    get:
      operationId: wall_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Ściana kafelków z migawki rankingu (kursor z wersją); kafelek = box
        + skrót przypięcia + spinka z ocen
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: doc_kind
        schema:
          type: string
      - in: query
        name: level
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: period
        schema:
          type: integer
      - in: query
        name: person
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
        description: level | newest | today (domyślnie wg min_rated_share)
      - in: query
        name: topic
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: all | post | diagnosis | article | video | documents
      - in: query
        name: with_diagnosis
        schema:
          type: boolean
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WallOut'
          description: ''
