      - in: path
        name: pin_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingOut'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/report/:
    post:
      operationId: report_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Zgłoś przypięcie, box albo komentarz (kategorie DSA, SLA 24 h dla pilnych)
