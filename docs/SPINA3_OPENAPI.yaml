  /api/spina3/pin/{pin_id}/rating/:
    put:
      operationId: pin_rating_update
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Oceń przypięcie autora: zgadzam się | nie zgadzam się (tworzy albo
        zmienia; 403 własne, 409 dowód niedostępny, 429 limit)'
      parameters:
      - in: path
        name: pin_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      requestBody:
        content:
          application/json:
