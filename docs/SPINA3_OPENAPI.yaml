openapi: 3.0.3
info:
  title: spina3 API
  version: 2.0.0
  description: 'spina3.pl v2: autor dodaje box z DOKŁADNIE JEDNYM przypięciem (dowód:
    box z bazy, URL albo zdjęcie) z komentarzem; inni użytkownicy oceniają przypięcie
    dwustanowo (agree / disagree, jedna ocena, zmiana i wycofanie) i komentują (jeden
    poziom odpowiedzi, "przydatny"). Spinka: S = suma ważonych ocen / (n_w + 3). Operator:
    iapply sp. z o.o. Publiczne API zwraca tylko pola dozwolone flagami praw. Kursor
    ściany zawiera wersję migawki rankingu (co 10 minut).'
paths:
  /api/spina3/auth/exchange/:
    post:
      operationId: auth_exchange_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Wymiana jednorazowego kodu z usługi kont na krótki token sesji (auth_mode=token)
      tags:
      - spina3 auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CodeInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodeInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/auth/logout-everywhere/:
    post:
      operationId: auth_logout_everywhere_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Wyloguj wszędzie (rotacja pseudonimu unieważnia wszystkie tokeny)
      tags:
      - spina3 auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Odświeżenie tokenu sesji
      tags:
      - spina3 auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/box/{box_id}/:
    get:
      operationId: box_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Box, jedyne przypięcie autora z ocenami, spinka, moja ocena, czy mogę
        przypiąć lub ocenić
      parameters:
      - in: path
        name: box_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxDetailOut'
          description: ''
  /api/spina3/box/{box_id}/comments/:
    get:
      operationId: box_comments_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Komentarze pod parą box + przypięcie: główne z odpowiedziami, sort
        newest | top, kursor'
      parameters:
      - in: path
        name: box_id
        schema:
          type: integer
        required: true
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: sort
        schema:
          type: string
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsOut'
          description: ''
    post:
      operationId: box_comments_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Dodaj komentarz (parent = odpowiedź do komentarza głównego); 409 duplikat,
        423 cisza, 429 limit
      parameters:
      - in: path
        name: box_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommentInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommentInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreateOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '423':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/box/{box_id}/related/:
    get:
      operationId: box_related_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Półka podobnych (do 6): dla wpisu najpierw diagnoza i dokumenty źródłowe'
      parameters:
      - in: path
        name: box_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/boxes/:
    post:
      operationId: boxes_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Dodaj box z JEDNYM przypięciem (jedna operacja): kotwica (box z bazy
        bez przypięcia | URL | zdjęcie) + dowód (box | URL | zdjęcie) z komentarzem'
      tags:
      - spina3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoxWithPinInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoxWithPinInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoxWithPinInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxWithPinOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '423':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/boxes/search/:
    get:
      operationId: boxes_search_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Wyszukiwanie z normalizacją polskich znaków; wynik w strukturze ściany
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOut'
          description: ''
  /api/spina3/comment/{comment_id}/:
    patch:
      operationId: comment_partial_update
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Edytuj własny komentarz
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentPatchInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentPatchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentPatchInRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreateOut'
          description: ''
    delete:
      operationId: comment_destroy
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Usuń własny komentarz
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/spina3/comment/{comment_id}/appeal/:
    post:
      operationId: comment_appeal_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Odwołanie od ukrycia własnego komentarza (jedno na decyzję, 14 dni)
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppealInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppealInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/comment/{comment_id}/helpful/:
    put:
      operationId: comment_helpful_update
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Oznacz komentarz jako przydatny
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentOut'
          description: ''
    delete:
      operationId: comment_helpful_destroy
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Cofnij "przydatny"
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/spina3/config/:
    get:
      operationId: config_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Publiczna konfiguracja modelu oceny, kolory nicków, flagi i stan ciszy
        wyborczej
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigOut'
          description: ''
  /api/spina3/facets/:
    get:
      operationId: facets_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Liczności wymiarów (osoba lub podmiot, temat, okres, poziom, rodzaj
        dokumentu lub źródło, z diagnozą)
      parameters:
      - in: query
        name: period
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/me/boxes/:
    get:
      operationId: me_boxes_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Moje boxy (tylko właściciel konta)
      tags:
      - spina3
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBoxesOut'
          description: ''
  /api/spina3/me/consent/:
    post:
      operationId: me_consent_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Zgoda przed pierwszą publikacją (stanowiska i komentarze publiczne
        przy nicku, bez profilu)
      tags:
      - spina3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/me/profile/:
    get:
      operationId: me_profile_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Mój profil spina3: kolor nicku, znaczek, zgoda, poziom i limity (nigdy
        publiczne)'
      tags:
      - spina3
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: ''
    patch:
      operationId: me_profile_partial_update
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Ustaw kolor nicku z listy dozwolonych identyfikatorów (spin zarezerwowany
        dla Dr. Spina: 403)'
      tags:
      - spina3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileInRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
          description: ''
  /api/spina3/me/ratings/:
    get:
      operationId: me_ratings_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Moje oceny (tylko właściciel konta)
      tags:
      - spina3
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRatingsOut'
          description: ''
  /api/spina3/moderation/appeals/{appeal_id}/:
    post:
      operationId: moderation_appeals_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Decyzja w sprawie odwołania (accept | reject) z uzasadnieniem
      parameters:
      - in: path
        name: appeal_id
        schema:
          type: integer
        required: true
      tags:
      - spina3 zespół
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/moderation/comments/{comment_id}/:
    post:
      operationId: moderation_comments_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Ukryj komentarz z uzasadnieniem (DSA art. 17) albo przywróć / zatwierdź
        wstrzymany (restore)
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      tags:
      - spina3 zespół
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/moderation/metrics/:
    get:
      operationId: moderation_metrics_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Metryki jakości z agregatów (bez śledzenia) i alarmy
      tags:
      - spina3 zespół
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/moderation/pins/{pin_id}/:
    post:
      operationId: moderation_pins_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Szybkie ukrycie przypięcia z powodem (bez zgłoszenia) albo przywrócenie
      parameters:
      - in: path
        name: pin_id
        schema:
          type: integer
        required: true
      tags:
      - spina3 zespół
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/moderation/queue/:
    get:
      operationId: moderation_queue_retrieve
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Kolejki zespołu: zgłoszenia z SLA, odwołania, adresy, komentarze wstrzymane,
        boxy oczekujące'
      tags:
      - spina3 zespół
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/moderation/reports/{report_id}/:
    post:
      operationId: moderation_reports_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Decyzja w sprawie zgłoszenia (hide | dismiss) z uzasadnieniem
      parameters:
      - in: path
        name: report_id
        schema:
          type: integer
        required: true
      tags:
      - spina3 zespół
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/moderation/urls/{check_id}/:
    post:
      operationId: moderation_urls_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: 'Decyzja w sprawie adresu z kolejki (accept publikuje box kotwicę albo
        tworzy box z linku; reject: box ukryty, dowód 7 dni na wymianę)'
      parameters:
      - in: path
        name: check_id
        schema:
          type: integer
        required: true
      tags:
      - spina3 zespół
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlDecisionInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UrlDecisionInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UrlDecisionInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/spina3/pin/{pin_id}/:
    patch:
      operationId: pin_partial_update
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Edytuj własne przypięcie (komentarz, stanowisko autora raz na 24 h,
        wymiana dowodu)
      parameters:
      - in: path
        name: pin_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPinPatchInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPinPatchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPinPatchInRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinPatchOut'
          description: ''
    delete:
      operationId: pin_destroy
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Usuń własne przypięcie (box dodany przez autora znika ze ściany; oceny
        przestają się liczyć)
      parameters:
      - in: path
        name: pin_id
        schema:
          type: integer
        required: true
      tags:
      - spina3
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/spina3/pin/{pin_id}/appeal/:
    post:
      operationId: pin_appeal_create
      description: Sesja (domyślnie) albo token Bearer ze wspólnego logowania (auth_mode=token).
      summary: Odwołanie od ukrycia własnego przypięcia (jedno na decyzję, 14 dni)
