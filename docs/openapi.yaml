components:
  schemas:
    AccountCampEnum:
      enum:
      - government
      - opposition
      - public
      type: string
      description: |-
        * `government` - Obóz rządzący
        * `opposition` - Opozycja
        * `public` - Instytucja publiczna
    Article:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Tytuł
          maxLength: 500
        url:
          type: string
          format: uri
          title: Adres URL
          maxLength: 1024
        published_date:
          type: string
          format: date-time
          nullable: true
          title: Data publikacji
        date_precision:
          $ref: '#/components/schemas/DatePrecisionEnum'
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          title: Kategoria
        tags:
          description: Hasła jawnie podane przez wydawcę; nie są oceną treści.
        image_url:
          title: Obraz
          oneOf:
          - type: string
            format: uri
            maxLength: 1024
          - type: string
            maxLength: 0
        source:
          allOf:
          - $ref: '#/components/schemas/Source'
          readOnly: true
        author:
          type: string
          maxLength: 200
        description:
          type: string
        tweet_id:
          type: string
          maxLength: 64
        likes_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        retweets_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        discovered_at:
          type: string
          format: date-time
          nullable: true
        ingestion_method:
          $ref: '#/components/schemas/IngestionMethodEnum'
        category_reviewed:
          type: boolean
        evidence_note:
          type: string
          description: Jak redakcja sprawdziła pochodzenie lub treść materiału.
        voting:
          allOf:
          - $ref: '#/components/schemas/VotingSummary'
          nullable: true
          readOnly: true
        evidence_links:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceLink'
          readOnly: true
        official:
          nullable: true
          readOnly: true
        content_status:
          type: string
          readOnly: true
      required:
      - content_status
      - evidence_links
      - id
      - official
      - source
      - title
      - url
      - voting
    ArticleContextResponse:
      type: object
      properties:
        query:
          type: string
        keywords:
          type: array
          items:
            type: string
        match_basis:
          type: string
        counts:
          type: array
          items:
            $ref: '#/components/schemas/ContextCategoryCount'
        total:
          type: integer
        timeline:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Article'
          description: Materiały powiązane pogrupowane według daty publikacji (YYYY-MM-DD
            lub `unknown`).
        next_page:
          type: integer
          nullable: true
        checked_at:
          type: string
          format: date-time
      required:
      - checked_at
      - counts
      - keywords
      - match_basis
      - next_page
      - query
      - timeline
      - total
    Ballot:
      type: object
      properties:
        mp_id:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 255
        club:
          type: string
          maxLength: 100
        vote:
          type: string
          maxLength: 30
        list_votes: {}
      required:
      - mp_id
      - name
      - vote
    BlankEnum:
      enum:
      - ''
    CatalogStageEnum:
      enum:
      - candidate
      - configured
      - excluded
      type: string
      description: |-
        * `candidate` - Kandydat
        * `configured` - Skonfigurowane
        * `excluded` - Wykluczone
    CategoryEnum:
      enum:
      - voting
      - legislation
      - parliamentary_print
      - reportage
      - interview
      - podcast
      - document
      - advertisement
      - other
      - statement
      - mention
      - video
      - sponsored
      - article
      - tweet
      - factcheck
      - context
      - opinion
      type: string
      description: |-
        * `voting` - Głosowanie Sejmu
        * `legislation` - Akt prawny / obwieszczenie
        * `parliamentary_print` - Druk sejmowy
        * `reportage` - Reportaż
        * `interview` - Wywiad
        * `podcast` - Podcast
        * `document` - Dokument urzędowy
        * `advertisement` - Reklama
        * `other` - Inne / nieustalona kategoria
        * `statement` - Komunikat / oświadczenie
        * `mention` - Wzmianka
        * `video` - Film
        * `sponsored` - Sponsorowane
        * `article` - Artykuł
        * `tweet` - Tweet
        * `factcheck` - Fact-check
        * `context` - Kontekst
        * `opinion` - Opinia
    ContextCategoryCount:
      type: object
      properties:
