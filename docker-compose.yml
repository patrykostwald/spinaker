services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: spin
      POSTGRES_PASSWORD: spin
      POSTGRES_DB: spin_clinic
    # Brak sekcji "ports": PostgreSQL jest dostępny tylko wewnątrz sieci
    # Docker Compose (dla usług "backend"/"worker"/"beat" pod adresem db:5432).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spin -d spin_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Brak sekcji "ports": Redis jest dostępny tylko wewnątrz sieci
    # Docker Compose (pod adresem redis:6379).

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      # TYMCZASOWO wystawione publicznie do bezpośrednich testów.
      # Docelowo cały ruch ma iść przez Caddy (usługa "caddy") - usunąć
      # ten wpis, gdy zostanie to potwierdzone na produkcji.
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://spin:spin@db:5432/spin_clinic
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://spin:spin@db:5432/spin_clinic
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  beat:
    build: ./backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://spin:spin@db:5432/spin_clinic
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - backend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
