button{display:inline-flex;align-items:center;min-height:44px;padding:0 18px 0 14px;border:1px solid var(--a);border-radius:8px;background:transparent;color:var(--a);font:600 15.5px/1 inherit;font-family:inherit;cursor:pointer}
