<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><title>Brak połączenia - spin.clinic</title>
<style>:root{--sc-bg:#000;--sc-text:#fff;--sc-text-2:#b3b3b3;--sc-accent:#4a9eff;--sc-line:#2a2a2a;--sc-surface:#0d0d0d}*{box-sizing:border-box}body{margin:0;background:var(--sc-bg);color:var(--sc-text);font-family:Montserrat,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 16px}main{width:100%;max-width:720px}h1{font-size:28px;margin:16px 0 8px}h2{font-size:16px;margin:0}p{color:var(--sc-text-2);line-height:1.7;margin:8px 0}a{color:var(--sc-accent)}button{background:var(--sc-accent);color:#04101f;border:0;border-radius:12px;min-height:44px;padding:12px 20px;font:inherit;cursor:pointer}nav{display:flex;gap:8px 20px;flex-wrap:wrap;margin-top:24px}nav a{display:inline-flex;align-items:center;min-height:44px}#last{margin-top:32px}#last[hidden]{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.box{display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-height:216px;padding:16px;background:var(--sc-surface);border:1px solid var(--sc-line);border-radius:12px}.box h3{margin:0;font-size:15px;white-space:nowrap}.box p{margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.box time{font-size:12px;color:var(--sc-text-2)}.note{font-size:12px}@media(max-width:640px){.grid{grid-template-columns:1fr}.box{min-height:200px}}:focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}</style>
<main><img src="/app/icon-192.png" width="64" height="64" alt="spin.clinic"><h1>Brak połączenia</h1><p>Sprawdź internet i spróbuj ponownie. Twoje ustawienia pozostają zapisane w przeglądarce.</p><button type="button" onclick="location.reload()">Spróbuj ponownie</button>
<section id="last" hidden aria-labelledby="last-title"><h2 id="last-title">Ostatnie przekazy dnia zapisane w aplikacji</h2><div class="grid" id="last-grid"></div><p class="note" id="last-note"></p></section>
<nav aria-label="Aplikacja"><a href="/klinika">Klinika</a><a href="/">Wiadomości</a><a href="/klinika/przekazy">Przekazy dnia</a></nav></main>
<script>
(function () {
  var LABELS = { government: 'Strona rządząca', opposition: 'Opozycja' };
  function box(camp, message) {
    var el = document.createElement('article'); el.className = 'box';
    var h = document.createElement('h3'); h.textContent = LABELS[camp] || camp;
    var p = document.createElement('p'); p.textContent = message.thesis || message.message || '';
    var t = document.createElement('time'); t.textContent = message.day || '';
    el.appendChild(h); el.appendChild(p); el.appendChild(t);
    return el;
  }
  function read(url) {
    return caches.match(url).then(function (res) { return res ? res.json().then(function (data) { return { data: data, at: Number(res.headers.get('X-Spin-Cached-At') || 0) }; }) : null; }).catch(function () { return null; });
  }
  if (!('caches' in window)) return;
  read('/api/clinic/').then(function (hit) {
    if (hit && hit.data && hit.data.messages) return { messages: hit.data.messages, at: hit.at };
    return read('/api/clinic/messages/?page=1').then(function (page) {
      var first = page && page.data && page.data.results && page.data.results[0];
      return first ? { messages: first, at: page.at } : null;
    });
  }).then(function (found) {
    if (!found) return;
    var grid = document.getElementById('last-grid'), count = 0;
    ['government', 'opposition'].forEach(function (camp) { var m = found.messages[camp]; if (m) { grid.appendChild(box(camp, m)); count++; } });
    if (!count) return;
    document.getElementById('last').hidden = false;
    if (found.at) document.getElementById('last-note').textContent = 'Stan z ' + new Date(found.at).toLocaleString('pl-PL') + '. Po odzyskaniu połączenia pokażemy najnowsze.';
  });
})();
</script></html>
