services:
  caddy:
    image: caddy:2-alpine
    env_file: ../.env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_DOMAIN: ${SPIN_DOMAIN:-spin.clinic}
        API_INTERNAL_URL: http://backend:8000
    env_file: ../.env.production
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://spin:${POSTGRES_PASSWORD}@db:5432/spin_clinic
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ../backend
    command: celery -A config worker -l info
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://spin:${POSTGRES_PASSWORD}@db:5432/spin_clinic
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  beat:
    build:
      context: ../backend
    command: celery -A config beat -l info
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://spin:${POSTGRES_PASSWORD}@db:5432/spin_clinic
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: spin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spin_clinic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spin -d spin_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
